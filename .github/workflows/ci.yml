name: Swift Payment Engine CI

on:
  push:
    branches:
      - main
      - master
      - feature/v2.1.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch and verify exact source commit (no third-party action)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "OpenMind-lab782/Copyswift-ai"
          test -n "$GITHUB_SHA"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          actual="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'Verified source commit: %s\n' "$actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Python 3.13 runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v python3.13
          python3.13 --version
          python3.13 -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mupdf-tools

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3.13 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python3.13 -m pip install -r requirements.txt
          fi

      - name: Compile
        shell: bash
        run: python3.13 -m compileall payment_engine

      - name: Run Tests
        shell: bash
        run: python3.13 -m unittest discover tests
