name: Generate and validate dependency lock candidate

on:
  push:
    branches:
      - proposal/engineering-review-worker-2026-10-21

permissions:
  contents: read

jobs:
  lock-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact proposal commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mupdf-tools
          command -v mutool

      - name: Generate SHA-256 lock candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/lockgen"
          "$RUNNER_TEMP/lockgen/bin/python" -m pip install "pip-tools==7.5.0"
          "$RUNNER_TEMP/lockgen/bin/python" -m piptools compile \
            --generate-hashes --allow-unsafe --resolver=backtracking \
            --output-file=requirements.lock requirements.txt
          export LOCK_INPUT="$RUNNER_TEMP/combined-requirements.in"
          python - <<'PY'
          import os
          from pathlib import Path
          base = Path("requirements.txt").read_text(encoding="utf-8")
          e2e = Path("requirements-e2e.txt").read_text(encoding="utf-8")
          Path(os.environ["LOCK_INPUT"]).write_text(
              base.rstrip() + "\n\n" + e2e.rstrip() + "\n",
              encoding="utf-8",
          )
          PY
          "$RUNNER_TEMP/lockgen/bin/python" -m piptools compile \
            --generate-hashes --allow-unsafe --resolver=backtracking \
            --output-file=requirements-e2e.lock "$LOCK_INPUT"
          test -s requirements.lock
          test -s requirements-e2e.lock
          grep -Eq -- '--hash=sha256:' requirements.lock
          grep -Eq -- '--hash=sha256:' requirements-e2e.lock

      - name: Install locked runtime dependencies and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/locked-runtime"
          "$RUNNER_TEMP/locked-runtime/bin/python" -m pip install --require-hashes -r requirements.lock
          "$RUNNER_TEMP/locked-runtime/bin/python" -m compileall payment_engine
          "$RUNNER_TEMP/locked-runtime/bin/python" -m unittest discover tests

      - name: Install locked E2E dependencies and run Chromium tests
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/locked-e2e"
          "$RUNNER_TEMP/locked-e2e/bin/python" -m pip install --require-hashes -r requirements-e2e.lock
          "$RUNNER_TEMP/locked-e2e/bin/python" -m playwright install --with-deps chromium
          mkdir -p e2e-artifacts
          SWIFT_DB_BACKEND=sqlite \
          SWIFT_DATABASE="$GITHUB_WORKSPACE/e2e-artifacts/swift_payment.db" \
          DATABASE_URL="sqlite:///$GITHUB_WORKSPACE/e2e-artifacts/document_studio.db" \
          SECRET_KEY=document-studio-e2e-secret \
          ADMIN_PASSWORD=document-studio-e2e-admin \
          PAYSTACK_ENGINE_MODE=mock SWIFT_GATEWAY_MODE=mock SWIFT_ENV=development \
          E2E_ARTIFACT_DIR="$GITHUB_WORKSPACE/e2e-artifacts" \
          "$RUNNER_TEMP/locked-e2e/bin/python" -m unittest tests.e2e.test_document_studio_browser

      - name: Record verified source commit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > e2e-artifacts/commit.txt

      - name: Upload lock candidates and E2E evidence for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-lock-candidate-${{ github.sha }}
          path: |
            requirements.lock
            requirements-e2e.lock
            e2e-artifacts/
          if-no-files-found: error
          retention-days: 3
