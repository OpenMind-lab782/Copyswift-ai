name: Document Studio Browser E2E

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Real Chromium Document Studio E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
      SWIFT_DB_BACKEND: sqlite
      SWIFT_DATABASE: ${{ github.workspace }}/e2e-artifacts/swift_payment.db
      DATABASE_URL: sqlite:///${{ github.workspace }}/e2e-artifacts/document_studio.db
      SECRET_KEY: document-studio-e2e-secret
      ADMIN_PASSWORD: document-studio-e2e-admin
      PAYSTACK_ENGINE_MODE: mock
      SWIFT_GATEWAY_MODE: mock
      SWIFT_ENV: development
    steps:
      - name: Fetch and verify exact source commit (no third-party action)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "OpenMind-lab782/Copyswift-ai"
          test -n "$GITHUB_SHA"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          actual="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'Verified source commit: %s\n' "$actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Python 3.13 runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v python3.13
          python3.13 --version
          python3.13 -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'

      - name: Install MuPDF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mupdf-tools

      - name: Install application dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3.13 -m pip install --upgrade pip
          python3.13 -m pip install -r requirements.txt
          python3.13 -m pip install -r requirements-e2e.txt

      - name: Install Chromium
        shell: bash
        run: python3.13 -m playwright install --with-deps chromium

      - name: Run Document Studio browser E2E
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p e2e-artifacts
          python3.13 -m unittest tests.e2e.test_document_studio_browser

      - name: Record verified commit and local artifact inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p e2e-artifacts
          printf '%s\n' "$GITHUB_SHA" > e2e-artifacts/commit.txt
          {
            printf '\n## Browser E2E evidence\n'
            printf -- '- Verified commit: %s\n' "$GITHUB_SHA"
            printf -- '- Run ID: %s\n' "$GITHUB_RUN_ID"
            printf -- '- External actions used: none\n'
            printf -- '- Artifact upload: intentionally disabled to avoid blocked external actions; inspect test output in run logs\n'
            printf '\n### Files produced\n'
            find e2e-artifacts -maxdepth 2 -type f -printf -- '- %p (%s bytes)\n' | head -100
          } >> "$GITHUB_STEP_SUMMARY"
