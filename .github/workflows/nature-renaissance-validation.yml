name: Nature's Renaissance feature validation

on:
  push:
    branches:
      - feature/natures-renaissance-talking-products
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Nature's Renaissance tests
        run: python -m unittest -v tests.test_nature_renaissance

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build --pull -t copyswiftai-nature-renaissance:ci .
      - name: Start container
        run: |
          docker run --detach --rm --name copyswiftai-nr -p 18080:10000 copyswiftai-nature-renaissance:ci
      - name: Validate runtime routes and product content
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/health >/dev/null
          curl --fail --silent http://127.0.0.1:18080/nature-renaissance -o /tmp/nr.html
          grep -q "Meet the products" /tmp/nr.html
          grep -q "Play all products" /tmp/nr.html
          grep -q "Food supplements and herbal products are not medicines" /tmp/nr.html
      - name: Stop container
        if: always()
        run: docker stop copyswiftai-nr || true
