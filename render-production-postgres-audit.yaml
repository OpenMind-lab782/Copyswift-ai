services:
  - type: cron
    name: copyswiftai-production-postgres-audit
    runtime: python
    region: ohio
    plan: 0.5c-512mb
    schedule: "0 3 * * 1"
    buildCommand: pip install -r scripts/requirements-production-audit.txt
    startCommand: python scripts/production_postgres_audit.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: copyswiftai-production
          property: connectionString
