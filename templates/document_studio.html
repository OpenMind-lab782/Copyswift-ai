<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CopySwiftAI™ Document Studio</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.panel{background:white;border:1px solid #dfe4ec;border-radius:14px;padding:20px;margin-top:18px}button{padding:11px 18px;border:0;border-radius:8px;cursor:pointer;margin-right:8px}#importBtn{background:#172033;color:white}#exportBtn{background:#176b45;color:white}button:disabled{opacity:.5;cursor:not-allowed}pre{white-space:pre-wrap;overflow:auto;background:#f3f5f8;padding:14px;border-radius:8px;max-height:500px}#status{margin-top:14px;font-weight:600}</style></head><body><main class="wrap"><h1>CopySwiftAI™ Document Studio</h1><p>Edit and export existing PDF documents.</p><section class="panel"><h2>1. Your email</h2><p>Enter the email associated with your CopySwiftAI credits before importing.</p><input id="email" type="email" placeholder="you@email.com" autocomplete="email"><button id="identityBtn">Continue</button><div id="identityStatus"></div></section><section class="panel"><h2>2. Import PDF</h2><input id="file" type="file" accept=".pdf,application/pdf"><button id="importBtn" disabled>Import PDF</button><div id="status">Enter your email to begin.</div></section><section class="panel"><h2>3. Imported Document</h2><pre id="document">No document imported yet.</pre></section><section class="panel"><h2>4. Export</h2><button id="exportBtn" type="button" disabled>Export PDF</button></section></main><script>let documentData=null;const emailInput=document.getElementById("email"),identityBtn=document.getElementById("identityBtn"),identityStatus=document.getElementById("identityStatus"),fileInput=document.getElementById("file"),importBtn=document.getElementById("importBtn"),exportBtn=document.getElementById("exportBtn"),status=document.getElementById("status"),documentBox=document.getElementById("document");identityBtn.onclick=async()=>{const email=emailInput.value.trim();if(!email){identityStatus.textContent="Please enter your email address.";return}identityStatus.textContent="Saving email...";try{const r=await fetch("/document-studio/identity",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});const data=await r.json();if(!r.ok)throw new Error(data.error||"Unable to save email.");emailInput.value=data.user_email;identityBtn.disabled=true;emailInput.disabled=true;importBtn.disabled=false;identityStatus.textContent="Email confirmed. You can now import your PDF.";status.textContent="Ready to import PDF."}catch(e){identityStatus.textContent="Email setup failed: "+e.message}};importBtn.onclick=async()=>{const file=fileInput.files[0];if(!file){status.textContent="Please select a PDF first.";return}status.textContent="Importing PDF...";const form=new FormData();form.append("file",file);try{const r=await fetch("/document-studio/import",{method:"POST",body:form});const raw=await r.text();let data=null;try{data=raw?JSON.parse(raw):null}catch(_){throw new Error("Import response was not valid JSON.")}if(!r.ok)throw new Error(data&&data.error?data.error:"Import failed.");if(!data)throw new Error("Import response was empty.");documentData=data;documentBox.textContent=JSON.stringify(data,null,2);exportBtn.disabled=false;status.textContent="PDF imported successfully."}catch(e){status.textContent="Import failed: "+e.message}};exportBtn.addEventListener("click",async()=>{status.textContent="Export button clicked.";console.log("DS_EXPORT_CLICK",!!documentData,documentData&&documentData.document_token);if(!documentData){status.textContent="Export failed: no imported document data.";return;}status.textContent="Exporting PDF...";try{const r=await fetch("/document-studio/export",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({document_token:documentData.document_token,document:documentData})});if(!r.ok){const data=await r.json().catch(()=>({}));throw new Error(data.error||"Export failed.")}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="document-studio-output.pdf";a.click();URL.revokeObjectURL(url);status.textContent="PDF exported successfully."}catch(e){status.textContent="Export failed: "+e.message}});</script></body></html>
