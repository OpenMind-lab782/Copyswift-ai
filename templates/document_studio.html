<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CopySwiftAI™ Document Studio</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:24px}.panel{background:white;border:1px solid #dfe4ec;border-radius:14px;padding:20px;margin-top:18px}button{padding:11px 18px;border:0;border-radius:8px;cursor:pointer;margin-right:8px}#importBtn{background:#172033;color:white}#exportBtn{background:#176b45;color:white}button:disabled{opacity:.5;cursor:not-allowed}pre{white-space:pre-wrap;overflow:auto;background:#f3f5f8;padding:14px;border-radius:8px;max-height:500px}#status{margin-top:14px;font-weight:600}</style></head><body><main class="wrap"><h1>CopySwiftAI™ Document Studio</h1><p>Edit and export existing PDF documents.</p><section class="panel"><h2>1. Import PDF</h2><input id="file" type="file" accept=".pdf,application/pdf"><button id="importBtn">Import PDF</button><div id="status">Ready.</div></section><section class="panel"><h2>2. Imported Document</h2><pre id="document">No document imported yet.</pre></section><section class="panel"><h2>3. Export</h2><button id="exportBtn" disabled>Export PDF</button></section></main><script>let documentData=null;const fileInput=document.getElementById("file"),importBtn=document.getElementById("importBtn"),exportBtn=document.getElementById("exportBtn"),status=document.getElementById("status"),documentBox=document.getElementById("document");importBtn.onclick=async()=>{const file=fileInput.files[0];if(!file){status.textContent="Please select a PDF first.";return}status.textContent="Importing PDF...";const form=new FormData();form.append("file",file);try{const r=await fetch("/document-studio/import",{method:"POST",body:form});const data=await r.json();if(!r.ok)throw new Error(data.error||"Import failed.");documentData=data;documentBox.textContent=JSON.stringify(data,null,2);exportBtn.disabled=false;status.textContent="PDF imported successfully."}catch(e){status.textContent="Import failed: "+e.message}};exportBtn.onclick=async()=>{if(!documentData)return;status.textContent="Exporting PDF...";try{const r=await fetch("/document-studio/export",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({document:documentData})});if(!r.ok){const data=await r.json();throw new Error(data.error||"Export failed.")}const blob=await r.blob();const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="document-studio-output.pdf";a.click();URL.revokeObjectURL(url);status.textContent="PDF exported successfully."}catch(e){status.textContent="Export failed: "+e.message}};</script></body></html>
